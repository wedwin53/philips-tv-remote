<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TV Remote · multi-driver</title>
<style>
  :root{
    --bg:#0a0c10; --panel:#11151c; --panel2:#161b24; --line:#222b38;
    --txt:#dfe6f0; --dim:#7d8aa0; --accent:#38e1b0; --accent2:#2bb3ff;
    --warn:#ff5c6c; --ok:#38e1b0; --radius:12px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{padding:16px;max-width:520px;margin:0 auto;}
  h1{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
    margin:0 0 14px;font-weight:600;display:flex;align-items:center;gap:10px}
  .dot{width:9px;height:9px;border-radius:50%;background:#444;flex:0 0 auto;transition:.3s}
  .dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
  .dot.off{background:var(--warn);box-shadow:0 0 10px var(--warn)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:14px}
  .cfg{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .cfg input,.cfg select{background:var(--bg);border:1px solid var(--line);color:var(--txt);
    font-family:var(--mono);font-size:13px;padding:9px 10px;border-radius:8px}
  .cfg input:focus,.cfg select:focus{outline:none;border-color:var(--accent)}
  .cfg #ip{flex:1;min-width:120px}
  .cfg #brand{flex:0 0 auto}
  .cfg #api{max-width:52px}

  .banner{border-radius:var(--radius);padding:11px 14px;margin-bottom:14px;font-size:13.5px;
    font-weight:600;display:flex;align-items:center;gap:9px;border:1px solid transparent;line-height:1.35}
  .banner::before{content:"";width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:currentColor}
  .banner small{font-weight:400;opacity:.8;font-family:var(--mono);font-size:11px}
  .b-wait{background:#15202b;border-color:var(--line);color:var(--dim)}
  .b-on{background:#0d2a21;border-color:#1c5a46;color:var(--ok)}
  .b-off{background:#2a1215;border-color:#5a1c24;color:var(--warn)}
  .b-info{background:#102231;border-color:#1c4a5a;color:var(--accent2)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .b-wait::before{animation:pulse 1s infinite}

  .status{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);
    border-radius:8px;overflow:hidden}
  .status .cell{background:var(--panel2);padding:10px 12px}
  .status .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .status .v{font-family:var(--mono);font-size:15px;margin-top:3px;color:var(--txt);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .vol{display:flex;align-items:center;gap:12px}
  .vol input[type=range]{flex:1;accent-color:var(--accent)}
  .volnum{font-family:var(--mono);font-size:15px;min-width:46px;text-align:right;color:var(--accent)}

  .grid{display:grid;gap:8px}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  button.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    font-size:14px;padding:12px 6px;border-radius:10px;cursor:pointer;transition:.1s;
    -webkit-user-select:none;user-select:none;font-family:inherit}
  button.btn:hover{border-color:var(--accent);color:#fff}
  button.btn:active{transform:scale(.95);background:var(--accent);color:#06130f;border-color:var(--accent)}
  button.btn.sym{font-family:var(--mono);font-size:16px}
  button.btn.danger:hover{border-color:var(--warn);color:var(--warn)}
  button.btn.accent{border-color:#1e3a44;color:var(--accent)}
  button.btn[disabled]{opacity:.32;cursor:not-allowed;pointer-events:none}

  .label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:4px 2px 8px}

  .dpad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,56px);gap:8px;
    max-width:260px;margin:0 auto}
  .dpad .sp{visibility:hidden}
  .dpad .ok{background:var(--accent);color:#06130f;border-color:var(--accent);font-weight:700}

  .con{font-family:var(--mono);font-size:11.5px;color:var(--dim);background:var(--bg);
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:34px;
    white-space:pre-wrap;word-break:break-word;line-height:1.5}
  .con b{color:var(--accent)} .con .e{color:var(--warn)}
  .foot{font-size:11px;color:var(--dim);text-align:center;margin-top:4px;font-family:var(--mono)}
  .hide{display:none!important}
</style>
</head>
<body>
  <h1><span id="dot" class="dot"></span> TV Remote · <span id="brandname">Philips</span></h1>

  <div id="banner" class="banner b-wait">conectando…</div>

  <div class="card">
    <div class="cfg">
      <select id="brand">
        <option value="philips">Philips (JointSpace)</option>
        <option value="roku">Roku / TCL-Roku (ECP)</option>
        <option value="other">Samsung / LG / Sony…</option>
      </select>
      <input id="ip" value="192.168.18.10" spellcheck="false" />
      <input id="api" value="6" spellcheck="false" title="API version (Philips)" />
      <button class="btn accent" id="scanbtn" style="flex:0 0 auto;padding:9px 12px" onclick="discover()">Descubrir</button>
    </div>
  </div>

  <div class="card" id="statuscard">
    <div class="status">
      <div class="cell"><div class="k">Modelo</div><div class="v" id="st-model">—</div></div>
      <div class="cell"><div class="k">Estado</div><div class="v" id="st-ctx">—</div></div>
      <div class="cell"><div class="k">Volumen</div><div class="v" id="st-vol">—</div></div>
      <div class="cell"><div class="k">Extra</div><div class="v" id="st-amb">—</div></div>
    </div>
  </div>

  <div class="card">
    <div class="label">Volumen</div>
    <div class="vol" id="vol-slider">
      <button class="btn sym" onclick="key('mute')" title="Silenciar">⊘</button>
      <input id="volrange" type="range" min="0" max="60" value="0" oninput="setVol(this.value)" />
      <span class="volnum" id="volnum">--</span>
    </div>
    <div class="grid g3 hide" id="vol-keys">
      <button class="btn sym" onclick="key('voldown')">Vol −</button>
      <button class="btn sym" onclick="key('mute')">⊘ Mute</button>
      <button class="btn sym" onclick="key('volup')">Vol +</button>
    </div>
  </div>

  <div class="card">
    <div class="label">Navegación</div>
    <div class="dpad">
      <div class="sp"></div>
      <button class="btn sym" onclick="key('up')">▲</button>
      <div class="sp"></div>
      <button class="btn sym" onclick="key('left')">◀</button>
      <button class="btn ok" onclick="key('ok')">OK</button>
      <button class="btn sym" onclick="key('right')">▶</button>
      <div class="sp"></div>
      <button class="btn sym" onclick="key('down')">▼</button>
      <div class="sp"></div>
    </div>
    <div class="grid g3" style="margin-top:10px">
      <button class="btn" onclick="key('back')">Atrás</button>
      <button class="btn" onclick="key('home')">Home</button>
      <button class="btn" onclick="key('menu')">Opciones</button>
    </div>
  </div>

  <div class="card">
    <div class="label">Reproducción</div>
    <div class="grid g4">
      <button class="btn sym" onclick="key('rewind')">⏪</button>
      <button class="btn sym accent" onclick="key('playpause')">⏯</button>
      <button class="btn sym" onclick="key('stop')">⏹</button>
      <button class="btn sym" onclick="key('forward')">⏩</button>
    </div>
  </div>

  <div class="card">
    <div class="label">Canal · Fuente · Encendido</div>
    <div class="grid g3">
      <button class="btn" onclick="key('chup')">Canal +</button>
      <button class="btn" onclick="key('source')">Fuente</button>
      <button class="btn" onclick="key('chdown')">Canal −</button>
      <button class="btn" onclick="key('watchtv')">Ver TV</button>
      <button class="btn" onclick="key('info')">Info</button>
      <button class="btn danger" onclick="confirmPower()">⏻ Power</button>
    </div>
  </div>

  <div class="card">
    <div class="label">Teclado numérico</div>
    <div class="grid g3">
      <button class="btn sym" onclick="key('d1')">1</button>
      <button class="btn sym" onclick="key('d2')">2</button>
      <button class="btn sym" onclick="key('d3')">3</button>
      <button class="btn sym" onclick="key('d4')">4</button>
      <button class="btn sym" onclick="key('d5')">5</button>
      <button class="btn sym" onclick="key('d6')">6</button>
      <button class="btn sym" onclick="key('d7')">7</button>
      <button class="btn sym" onclick="key('d8')">8</button>
      <button class="btn sym" onclick="key('d9')">9</button>
      <button class="btn sym" onclick="key('dot')">·</button>
      <button class="btn sym" onclick="key('d0')">0</button>
      <button class="btn sym" onclick="key('enter')">↵</button>
    </div>
  </div>

  <div class="card">
    <div class="label">Consola</div>
    <div class="con" id="con">listo.</div>
  </div>
  <div class="foot" id="foot">—</div>

<script>
const $ = id => document.getElementById(id);
const ipv = () => $('ip').value.trim();

/* ========================= DRIVERS =========================
 * Each driver maps the app's logical keys to a brand protocol.
 * caps: { status, volumeSlider }  -> drives which UI parts show.
 * All requests must be browser "simple requests" (no preflight) or no-cors.
 * ----------------------------------------------------------- */
const DRIVERS = {

  philips: {
    name:'Philips', port:1925, caps:{status:true, volumeSlider:true}, usesApiVer:true,
    base(){ return `http://${ipv()}:1925/${$('api').value.trim()||'6'}`; },
    keymap:{ up:'CursorUp',down:'CursorDown',left:'CursorLeft',right:'CursorRight',ok:'Confirm',
      back:'Back',home:'Home',menu:'Options',playpause:'PlayPause',stop:'Stop',rewind:'Rewind',
      forward:'FastForward',chup:'ChannelStepUp',chdown:'ChannelStepDown',source:'Source',
      watchtv:'WatchTV',info:'Info',power:'Standby',mute:'Mute',volup:'VolumeUp',voldown:'VolumeDown',
      d0:'Digit0',d1:'Digit1',d2:'Digit2',d3:'Digit3',d4:'Digit4',d5:'Digit5',d6:'Digit6',
      d7:'Digit7',d8:'Digit8',d9:'Digit9',dot:'Dot',enter:'ConfirmChannel' },
    async sendKey(logical){
      const k = this.keymap[logical]; if(!k) return {skip:true};
      const r = await simplePost(this.base()+'/input/key', JSON.stringify({key:k}));
      return {ok:r};
    },
    async setVolume(n){
      return { ok: await simplePost(this.base()+'/audio/volume', JSON.stringify({muted:false,current:Number(n)})) };
    },
    async status(){
      const vol = await getJSON(this.base()+'/audio/volume');
      if(!vol) return {ok:false};
      const sys = await getJSON(this.base()+'/system');
      const ctx = await getJSON(this.base()+'/context');
      const amb = await getJSON(this.base()+'/ambilight/mode');
      return { ok:true,
        model: sys && sys.name ? sys.name : '—',
        volume: vol,
        context: ctx ? (ctx.level1 + (ctx.Recording==='On'?' · REC':'')) : '—',
        extra: amb && amb.current ? 'Ambilight: '+amb.current : '—' };
    }
  },

  roku: {
    name:'Roku', port:8060, caps:{status:false, volumeSlider:false}, usesApiVer:false,
    base(){ return `http://${ipv()}:8060`; },
    keymap:{ up:'Up',down:'Down',left:'Left',right:'Right',ok:'Select',back:'Back',home:'Home',
      menu:'Info',playpause:'Play',stop:'Back',rewind:'Rev',forward:'Fwd',chup:'ChannelUp',
      chdown:'ChannelDown',source:'InputHDMI1',watchtv:'InputTuner',info:'Info',power:'Power',
      mute:'VolumeMute',volup:'VolumeUp',voldown:'VolumeDown',enter:'Enter',dot:'Lit_.',
      d0:'Lit_0',d1:'Lit_1',d2:'Lit_2',d3:'Lit_3',d4:'Lit_4',d5:'Lit_5',d6:'Lit_6',
      d7:'Lit_7',d8:'Lit_8',d9:'Lit_9' },
    async sendKey(logical){
      const k = this.keymap[logical]; if(!k) return {skip:true};
      // ECP keypress: POST, fire-and-forget. Roku sends no CORS header, so use no-cors.
      try{
        await fetch(this.base()+'/keypress/'+k, {method:'POST', mode:'no-cors'});
        return {ok:true, blind:true};
      }catch(e){ return {ok:false, err:e}; }
    },
    // No slider: volume handled via volup/voldown keys.
    async status(){
      // ECP /query/* returns XML but no CORS header -> unreadable in-browser.
      // Confirm only that the port is listening (opaque no-cors resolve = alive).
      try{ await fetch(this.base()+'/', {mode:'no-cors'}); return {ok:true, blind:true}; }
      catch(e){ return {ok:false}; }
    }
  },

  other: {
    name:'Otra marca', port:0, caps:{status:false, volumeSlider:false}, usesApiVer:false,
    unsupported:true
  }
};

function drv(){ return DRIVERS[$('brand').value]; }

/* ===================== transport helpers ==================== */
let lastErr = null;
async function getJSON(url){
  try{ const r = await fetch(url, {cache:'no-store'}); lastErr=null; return JSON.parse(await r.text()); }
  catch(e){ lastErr=e; return null; }
}
// POST as a simple request (text/plain => no CORS preflight)
async function simplePost(url, body){
  try{
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain'}, body});
    await r.text(); lastErr=null; return r.ok;
  }catch(e){ lastErr=e; return false; }
}

/* ========================= UI glue ========================== */
function log(msg, err){
  const t = new Date().toLocaleTimeString();
  $('con').innerHTML = `<b>[${t}]</b> ` + (err ? `<span class="e">${msg}</span>` : msg);
}
function setDot(s){ $('dot').className = 'dot ' + s; }
function setBanner(state, msg, detail){
  $('banner').className = 'banner b-' + state;
  $('banner').innerHTML = msg + (detail ? ` <small>${detail}</small>` : '');
}
function reason(){
  if(location.protocol === 'https:')
    return 'página HTTPS → TV HTTP (mixed-content). Abre el archivo local.';
  return 'TV no responde: en standby (apagada) o fuera de la WiFi.';
}
function markOffline(){
  setDot('off');
  setBanner('off', location.protocol==='https:' ? 'Bloqueado por el navegador' : 'TV no alcanzable', reason());
  $('foot').textContent = 'sin conexión · ' + new Date().toLocaleTimeString();
}

async function key(logical){
  const d = drv();
  if(d.unsupported) return;
  const res = await d.sendKey(logical);
  if(res.skip){ log(`<b>${logical}</b> no existe en ${d.name}`, true); return; }
  if(res.ok){
    log(res.blind ? `<b>${logical}</b> enviado (ciego, sin confirmación)` : `tecla <b>${logical}</b> enviada`);
    if(logical==='mute') setTimeout(refresh, 400);
  }else{
    log(`no se pudo enviar <b>${logical}</b> → ${reason()}`, true);
    markOffline();
  }
}
async function setVol(v){
  $('volnum').textContent = v;
  const d = drv();
  if(!d.setVolume) return;
  const res = await d.setVolume(v);
  if(res.ok) log(`volumen → <b>${v}</b>`);
  else{ log(`no se pudo ajustar volumen → ${reason()}`, true); markOffline(); }
}
function confirmPower(){
  if(confirm('¿Enviar Power/Standby a la TV?')) key('power');
}

/* ===================== brand switching ====================== */
function applyBrand(){
  const d = drv();
  $('brandname').textContent = d.name;
  $('api').classList.toggle('hide', !d.usesApiVer);
  // volume UI: slider vs key buttons
  $('vol-slider').classList.toggle('hide', !d.caps.volumeSlider);
  $('vol-keys').classList.toggle('hide', d.caps.volumeSlider);
  // status card
  $('statuscard').classList.toggle('hide', d.unsupported);
  if(d.unsupported){
    setDot('off');
    setBanner('info', 'Marca no soportada desde el navegador',
      'Samsung/LG/Sony exigen token, pairing o certificado TLS que un archivo local no puede negociar — usa su app oficial.');
    $('foot').textContent = 'driver no disponible';
    return;
  }
  setBanner('wait','conectando…');
  refresh();
}

/* ========================= polling ========================== */
async function refresh(){
  const d = drv();
  if(d.unsupported) return;
  const s = await d.status();
  if(!s.ok){ markOffline(); return; }
  setDot('on');

  if(s.blind){
    // Roku: reachable but responses unreadable due to CORS
    setBanner('on', 'Conectada', ipv()+':'+d.port+' · '+d.name+' (comandos ciegos, sin lectura)');
    $('st-model').textContent = d.name + ' TV';
    $('st-ctx').textContent = 'activo';
    $('st-vol').textContent = 'usa Vol ±';
    $('st-amb').textContent = '— (sin lectura)';
  }else{
    setBanner('on', 'Conectada', ipv()+':'+d.port+' · '+d.name);
    $('st-model').textContent = s.model || '—';
    $('st-ctx').textContent = s.context || '—';
    if(s.volume){
      const v = s.volume;
      $('st-vol').textContent = (v.muted?'muted · ':'') + v.current + '/' + v.max;
      const r = $('volrange'); r.max = v.max; r.value = v.current; $('volnum').textContent = v.current;
    }
    $('st-amb').textContent = s.extra || '—';
  }
  $('foot').textContent = 'conectado · ' + new Date().toLocaleTimeString();
}

/* ===================== LAN discovery ======================== */
// Philips is confirmable (readable /system). Roku we can only detect as "port open".
async function probePhilips(ip, ver, ms){
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms);
  try{ const r = await fetch(`http://${ip}:1925/${ver}/system`, {signal:c.signal, cache:'no-store'});
    const j = JSON.parse(await r.text()); return j && j.name ? j.name : null;
  }catch(e){ return null; } finally{ clearTimeout(t); }
}
async function probePort(ip, port, ms){
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms);
  try{ await fetch(`http://${ip}:${port}/`, {signal:c.signal, mode:'no-cors'}); return true; }
  catch(e){ return false; } finally{ clearTimeout(t); }
}

async function discover(){
  const btn = $('scanbtn'); if(btn.disabled) return;
  btn.disabled = true; const label = btn.textContent; btn.textContent = 'Escaneando…';
  const ver = $('api').value.trim() || '6';
  const m = ipv().match(/^(\d+\.\d+\.\d+)\./); const prefix = m ? m[1] : '192.168.18';
  log(`escaneando <b>${prefix}.1-254</b> (Philips:1925 · Roku:8060)…`);

  const hosts = []; for(let i=1;i<=254;i++) hosts.push(`${prefix}.${i}`);
  let done=0, found=null;
  const CONC=40, TO=1200;

  async function worker(){
    while(hosts.length && !found){
      const ip = hosts.shift();
      const name = await probePhilips(ip, ver, TO);
      if(name && !found){ found={ip, brand:'philips', name}; break; }
      if(!found && await probePort(ip, 8060, TO)){ found={ip, brand:'roku', name:'Roku TV'}; break; }
      done++;
      if(done%20===0 && !found) $('foot').textContent = `escaneando… ${done}/254`;
    }
  }
  await Promise.all(Array.from({length:CONC}, worker));

  btn.disabled=false; btn.textContent=label;
  if(found){
    $('brand').value = found.brand;
    $('ip').value = found.ip;
    log(`encontrada <b>${found.name}</b> (${found.brand}) en <b>${found.ip}</b>`);
    applyBrand();
  }else{
    log('no se encontró ninguna TV Philips/Roku en la red', true);
    $('foot').textContent = 'escaneo completo · sin resultados';
  }
}

/* ========================= init ============================= */
$('brand').addEventListener('change', applyBrand);
['ip','api'].forEach(id=>$(id).addEventListener('change', refresh));
applyBrand();
setInterval(refresh, 4000);
</script>
</body>
</html>
